<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">MySLI cooking in a skillet</title>
  <desc id="desc">A warm launch illustration showing the MySLI name searing in a frying pan as the app moves toward public release.</desc>
  <defs>
