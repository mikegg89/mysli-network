      <stop offset="1" stop-color="#334856"/>
    </linearGradient>
    <linearGradient id="steak" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8d2c25"/>
      <stop offset="0.45" stop-color="#d06b47"/>
      <stop offset="1" stop-color="#6f211f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#102333" flood-opacity=".24"/>
